version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ["astro", "@astrojs/*", "astro-icon"]
      tooling:
        dependency-type: development
      runtime:
        dependency-type: production
        exclude-patterns: ["astro", "@astrojs/*", "astro-icon"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
