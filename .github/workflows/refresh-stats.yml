name: Refresh GitHub stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a Cloudflare Pages rebuild
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::notice::Add a CLOUDFLARE_DEPLOY_HOOK secret to rebuild the site (and its star counts) daily."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
